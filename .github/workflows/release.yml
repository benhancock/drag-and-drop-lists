name: Release plugin

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const manifest=require("./manifest.json"); const pkg=require("./package.json"); const lock=require("./package-lock.json"); const versions=require("./versions.json"); if (!/^\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG ?? "") || manifest.version !== process.env.RELEASE_TAG || pkg.version !== manifest.version || lock.version !== manifest.version || lock.packages[""].version !== manifest.version || versions[manifest.version] !== manifest.minAppVersion) process.exit(1);'
      - name: Test, lint, and build
        run: npm run check
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --draft --generate-notes main.js manifest.json styles.css
